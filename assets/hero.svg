<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="title desc">
<title id="title">PlayStation 2 to Xbox 360 research field guide</title>
<desc id="desc">Dark blue and green technical banner with processor icon and forward arrow.</desc>
